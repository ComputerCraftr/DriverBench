name: Install Linux graphics development dependencies
description: Install the build-only Linux graphics dependency set.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          glslc \
          libdrm-dev \
          libegl1-mesa-dev \
          libgbm-dev \
          libgl1-mesa-dev \
          libvulkan-dev \
          libx11-dev \
          libxcursor-dev \
          libxext-dev \
          libxi-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxrender-dev \
          ninja-build \
          pkg-config \
          python3
