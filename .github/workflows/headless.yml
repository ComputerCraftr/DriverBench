name: Headless CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headless-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Clang
            os: ubuntu-latest
          - name: macOS AppleClang
            os: macos-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Linux development dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            clang-tidy \
            glslc \
            libdrm-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libvulkan-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            ninja-build \
            pkg-config \
            python3

      - name: Configure
        run: >-
          cmake -S . -B build/ci-headless -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DDB_ENABLE_LTO=OFF
          -DDB_GLFW_PROVIDER=vendored
          -DDB_GLFW_REQUIRED=ON
          -DDB_TEST_HEADLESS_ONLY=ON

      - name: Build
        run: cmake --build build/ci-headless --parallel 4

      - name: Test
        env:
          CTEST_OUTPUT_ON_FAILURE: "1"
          DISPLAY: ""
          WAYLAND_DISPLAY: ""
        run: ctest --test-dir build/ci-headless --parallel 4
